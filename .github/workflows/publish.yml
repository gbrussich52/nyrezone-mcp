# Publishes to npm when a version tag is pushed, using npm trusted publishing
# (OIDC) — no NPM_TOKEN secret and no 2FA prompt. One-time setup on npmjs.com:
# package settings -> Trusted Publisher -> GitHub Actions, repo
# gbrussich52/nyrezone-mcp, workflow file publish.yml.
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Refuse to publish a tag whose version does not match package.json, which
      # is how a rebuilt bundle and a registry entry drift apart.
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; pinned exactly so a hijacked 'latest' cannot run with the publish token.
      - run: npm install -g npm@11.21.1

      - run: npm ci

      - run: npm test

      - run: npm publish --access public
