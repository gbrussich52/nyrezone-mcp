# Publishes to npm when a version tag is pushed, using npm trusted publishing
# (OIDC) — no NPM_TOKEN secret and no 2FA prompt. One-time setup on npmjs.com:
# package settings -> Trusted Publisher -> GitHub Actions, repo
# gbrussich52/nyrezone-mcp, workflow file publish.yml.
name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm; the one bundled with Node may lag.
      - run: npm install -g npm@latest

      - run: npm ci

      - run: npm test

      # Refuse to publish a tag whose version does not match package.json, which
      # is how a rebuilt bundle and a registry entry drift apart.
      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag $TAG does not match package.json $PKG" >&2
            exit 1
          fi

      - run: npm publish --access public
